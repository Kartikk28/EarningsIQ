name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: earningsiq
          POSTGRES_PASSWORD: earningsiq
          POSTGRES_DB: earningsiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U earningsiq"
          --health-interval 5s
          --health-retries 10
    env:
      EARNINGSIQ_TEST_DATABASE_URL: postgresql://earningsiq:earningsiq@localhost:5432/earningsiq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,pg]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -v
