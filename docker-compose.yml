services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: earningsiq
      POSTGRES_PASSWORD: earningsiq
      POSTGRES_DB: earningsiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earningsiq"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      EARNINGSIQ_DATABASE_URL: postgresql://earningsiq:earningsiq@db:5432/earningsiq
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
